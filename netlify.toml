[build]
  base = "web"
  command = "pnpm install --frozen-lockfile && pnpm run build"
  publish = "dist"

[build.environment]
  # Netlify picks up packageManager from web/package.json (pnpm).
  NODE_VERSION = "24"

# Demo API proxy — same-origin /api/v1 (the build-time default) reaches the
# hosted demo server without baking its URL into the bundle or needing CORS.
[[redirects]]
  from = "/api/*"
  to = "https://tradermemos-api-lbonh.eu-east-1.migetapp.com/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
