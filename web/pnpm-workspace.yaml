packages:
  - "."

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.1.0
  vitest: 5.0.3

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
