server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Match API upload caps (attachments / import / OCR).
    client_max_body_size 20m;

    # Same-origin API: browser uses relative /api/v1 → this proxy → Go container.
    # Upstream host `api` is the docker-compose service name.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /healthz {
        proxy_pass http://api:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
