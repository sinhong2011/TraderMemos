# Lint, typecheck, test, and build the SPA. Runs on every PR and push to main,
# and is reused by docker-publish.yml so release builds run the exact same
# checks. The "Test web" job is a required status check on main (repo ruleset).

name: Web CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: web

jobs:
  test-web:
    name: Test web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          # Empty = relative /api/v1 (Server field / edge rewrite at runtime).
          VITE_API: ${{ vars.VITE_API }}
