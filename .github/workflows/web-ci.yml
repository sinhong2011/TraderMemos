name: Web CI

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

defaults:
  run:
    working-directory: web

jobs:
  build:
    name: Build SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # 1.4 is canary-only until the Rust rewrite ships a stable tag.
          bun-version: canary

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          # Empty = relative /api/v1 (Server field / edge rewrite at runtime).
          VITE_API: ${{ vars.VITE_API }}
