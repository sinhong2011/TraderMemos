# Publish api + web images to Docker Hub.
#
# Repo secrets (Docker Hub → Account Settings → Security → Access Tokens):
#   DOCKERHUB_USERNAME   — Hub namespace (same value end users put in root .env)
#   DOCKERHUB_TOKEN
#
# Images:
#   docker.io/<username>/tradermemos-api
#   docker.io/<username>/tradermemos-web
#
# Self-host compose pulls those images via DOCKERHUB_USERNAME in root .env
# (see .env.example). Default namespace in compose is sinhong2011.
#
# Triggers:
#   - GitHub Release published (semver tags from the release tag)
#   - workflow_call from release-please (version input)
#   - workflow_dispatch (latest + sha on main; sha only on other branches;
#     pass version to also push semver tags, e.g. to backfill a failed release)
#
# Semver tags are raw values from the resolved version — type=semver only
# works on tag refs, and this workflow always runs on a branch ref.

name: Publish Docker images

on:
  workflow_call:
    inputs:
      version:
        description: Semver version without v prefix (from release-please)
        required: false
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Semver version without v prefix; empty = latest + sha only
        required: false
        type: string

jobs:
  # Same checks as PR CI — reused so a release can never publish images that
  # skipped tests.
  test-api:
    uses: ./.github/workflows/api-ci.yml

  test-web:
    uses: ./.github/workflows/web-ci.yml

  publish:
    name: Push ${{ matrix.image }}
    needs: [test-api, test-web]
    runs-on: ubuntu-latest
    # QEMU arm64 builds can wedge; a hung job otherwise blocks the
    # release-please concurrency group indefinitely.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: api/Dockerfile
          - image: web
            dockerfile: web/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - name: Resolve build metadata
        id: buildmeta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          SEMVER=true
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION=$(cat VERSION 2>/dev/null || echo dev)
            SEMVER=false
          fi
          {
            echo "version=$VERSION"
            echo "major_minor=${VERSION%.*}"
            echo "major=${VERSION%%.*}"
            echo "semver=$SEMVER"
            echo "commit=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/tradermemos-${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.buildmeta.outputs.version }},enable=${{ steps.buildmeta.outputs.semver == 'true' }}
            type=raw,value=${{ steps.buildmeta.outputs.major_minor }},enable=${{ steps.buildmeta.outputs.semver == 'true' }}
            type=raw,value=${{ steps.buildmeta.outputs.major }},enable=${{ steps.buildmeta.outputs.semver == 'true' }}
            type=raw,value=latest,enable=${{ steps.buildmeta.outputs.semver == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.buildmeta.outputs.version }}
            COMMIT=${{ steps.buildmeta.outputs.commit }}
            APP_VERSION=${{ steps.buildmeta.outputs.version }}
            APP_BUILD=${{ steps.buildmeta.outputs.commit }}
