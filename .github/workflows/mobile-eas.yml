# Build the mobile app on EAS Build. iOS builds can auto-submit to TestFlight;
# Android APK builds can be attached to the matching GitHub Release for sideloading
# (there is no Play Store presence — the APK on the release page IS the Android
# distribution channel, same shape as the tm-sync binaries).
#
# One-time setup (see docs/release.md → "Mobile releases"):
#   EXPO_TOKEN       repo secret — Expo access token (expo.dev → Account → Access tokens)
#   eas init         links mobile/app.json to an EAS project (writes extra.eas.projectId)
#   eas credentials  iOS: uploads the distribution cert, provisioning profile, and the
#                    App Store Connect API key EAS Submit uses.
#                    Android: run `eas credentials -p android` once to generate the
#                    release keystore — a --non-interactive build cannot create one
#                    and fails until it exists.
#   eas.json         submit.production.ios.ascAppId + appleTeamId are literal values
#                    (only the ascApiKey* fields expand $VARIABLES) — change them only
#                    if the app moves to a different Apple account
#
# Triggers:
#   - workflow_call from release-please (ios: production + submit; android:
#     production-apk + attach-to-release)
#   - workflow_dispatch (pick platform + profile; submit / attach are opt-in —
#     attach-to-release with a bare version like 0.8.4 backfills an APK onto an
#     existing release)
#
# Submitting is the irreversible step, so any run with submit=true goes through the
# app-store environment and waits for a reviewer — same gate shape as Docker Hub
# publishing. Plain builds (including the release-asset APK, which is replaceable
# with --clobber) run in eas-build, which needs no approval.

name: EAS Build

# Never cancel in flight: a killed job leaves the EAS-side build running anyway,
# and a release build is not something to interrupt. Platforms build
# independently, so they get separate groups — a release run calls this workflow
# once per platform and the two must not queue behind each other.
concurrency:
  group: mobile-eas-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

permissions:
  contents: write # gh release upload (APK attach)

on:
  workflow_call:
    inputs:
      profile:
        description: eas.json build profile
        required: true
        type: string
      platform:
        description: eas build --platform value (ios or android)
        default: ios
        type: string
      submit:
        description: Submit the finished build to App Store Connect (iOS only)
        default: false
        type: boolean
      attach-to-release:
        description: Bare version (0.8.4) — attach the finished APK to GitHub Release v<version>
        default: ''
        type: string
      message:
        description: Build message shown in the EAS dashboard
        required: false
        type: string
  workflow_dispatch:
    inputs:
      profile:
        description: eas.json build profile
        type: choice
        default: preview
        options:
          - development
          - preview
          - production
          - production-apk
      platform:
        description: Platform to build
        type: choice
        default: ios
        options:
          - ios
          - android
      submit:
        description: Submit the finished build to App Store Connect (TestFlight, iOS only)
        type: boolean
        default: false
      attach-to-release:
        description: Bare version like 0.8.4 — attach the finished APK to GitHub Release v<version> (android only)
        default: ''
        type: string
      wait:
        description: Keep the job running until EAS finishes the build
        type: boolean
        default: true
      # Re-running a release by hand is the main reason to dispatch this workflow, and a
      # bare version number here ("0.4.0") is what makes "What to Test" pick up that
      # version's CHANGELOG section instead of the last commit subject.
      message:
        description: Build message — a bare version like 0.4.0 sources release notes from CHANGELOG.md
        required: false
        type: string

jobs:
  # Same checks as PR CI — reused so a release can never build code that skipped them.
  test-mobile:
    uses: ./.github/workflows/mobile-ci.yml
    # Per-platform, so the iOS and Android calls in a release run don't land in
    # one concurrency group and cancel each other while queued.
    with:
      concurrency-key: ${{ inputs.platform }}

  build:
    name: EAS build (${{ inputs.platform }} · ${{ inputs.profile }})
    needs: test-mobile
    runs-on: ubuntu-latest
    environment: ${{ inputs.submit && 'app-store' || 'eas-build' }}
    # EAS queues can be long; the cap keeps a stuck run from pinning the
    # release-please concurrency group.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      # Fail in five seconds with a pointer to the fix, instead of after a
      # dependency install with an EAS CLI stack trace.
      - name: Preflight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
          SUBMIT: ${{ inputs.submit }}
          ATTACH: ${{ inputs.attach-to-release }}
        run: |
          # shellcheck disable=SC2016  # the single-quoted node script is JS, not shell
          [ -n "$EXPO_TOKEN" ] || { echo "::error::EXPO_TOKEN secret is not set (expo.dev → Account → Access tokens)."; exit 1; }
          case "$PLATFORM" in ios|android) ;; *) echo "::error::platform must be ios or android, got \"$PLATFORM\"."; exit 1;; esac
          if [ "$SUBMIT" = "true" ] && [ "$PLATFORM" != "ios" ]; then
            echo "::error::submit is TestFlight-only — there is no Play Store presence; Android ships as a release-page APK (attach-to-release)."
            exit 1
          fi
          if [ -n "$ATTACH" ] && [ "$PLATFORM" != "android" ]; then
            echo "::error::attach-to-release produces an APK release asset and needs platform: android."
            exit 1
          fi
          # The version lands in shell commands and filenames below — reject
          # anything that isn't a plain semver-ish token.
          if [ -n "$ATTACH" ] && ! printf '%s' "$ATTACH" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.+-]*$'; then
            echo "::error::attach-to-release must be a bare version like 0.8.4, got \"$ATTACH\"."
            exit 1
          fi
          node -e '
            const { expo } = require("./app.json");
            if (!expo?.extra?.eas?.projectId) {
              console.error("::error::app.json has no extra.eas.projectId — run \"npx eas-cli init\" in mobile/ and commit the result.");
              process.exit(1);
            }
            if (process.env.SUBMIT !== "true") process.exit(0);
            const profile = process.env.PROFILE;
            const ios = require("./eas.json").submit?.[profile]?.ios;
            if (!ios) {
              console.error("::error::eas.json has no submit profile named \"" + profile + "\" — only production can be submitted.");
              process.exit(1);
            }
            for (const [field, shape] of [["ascAppId", /^[0-9]+$/], ["appleTeamId", /^[A-Z0-9]+$/]]) {
              if (!shape.test(ios[field] ?? "")) {
                console.error(
                  "::error::eas.json submit." + profile + ".ios." + field + " is not set to a real value " +
                    "(it reads literally — only the ascApiKey* fields expand environment variables)."
                );
                process.exit(1);
              }
            }
          '

      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.node-version
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      # packager only controls how the action installs eas-cli into its own temp
      # directory (not mobile/, so pnpm-workspace.yaml never applies there). Under
      # pnpm 11 that bare-directory install dies on ERR_PNPM_IGNORED_BUILDS
      # (dtrace-provider, an optional dep with a build script nothing can answer
      # for); npm has no build-script gate. The project itself still installs with
      # pnpm in the Install step below.
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install
        run: pnpm install --frozen-lockfile

      # TestFlight's "What to Test" panel can't be filled from here: EAS Submit's
      # changelog parameter (the --what-to-test flag) is Enterprise-plan-only and
      # fails the whole submission on any other plan. Compose the notes anyway and
      # publish them in the job summary, so pasting them into App Store Connect is
      # a copy away. A release build gets that version's CHANGELOG section, any
      # other build gets the commit subject. TestFlight is iOS-only, so Android
      # runs skip it.
      - name: Compose What to Test
        if: ${{ inputs.platform == 'ios' }}
        env:
          MESSAGE: ${{ inputs.message || '' }}
        run: |
          {
            echo '## What to Test (paste into TestFlight)'
            echo '```'
            python3 - <<'PY'
          import os, pathlib, re, subprocess

          notes = ""
          release = re.fullmatch(r"v?(\d+\.\d+\.\d+)", os.environ.get("MESSAGE", "").strip())
          if release:
              changelog = pathlib.Path("../CHANGELOG.md")
              if changelog.exists():
                  text = changelog.read_text(encoding="utf-8")
                  # release-please writes "## [0.3.0](compare-url) (2026-08-04)".
                  # Only "## " ends a section — "### Features" is inside one.
                  heading = re.search(
                      rf"^## \[?{re.escape(release.group(1))}\]?.*$", text, re.M
                  )
                  if heading:
                      rest = text[heading.end():]
                      following = re.search(r"^## ", rest, re.M)
                      notes = (rest[: following.start()] if following else rest).strip()
          if not notes:
              notes = subprocess.run(
                  ["git", "log", "-1", "--pretty=%s"], capture_output=True, text=True
              ).stdout.strip()

          # TestFlight renders this as plain text, so markdown would ship literally.
          notes = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", notes)  # links -> label
          notes = re.sub(r"\s*\(\b[0-9a-f]{7,40}\b\)", "", notes)  # commit sha refs
          notes = notes.replace("**", "")
          notes = re.sub(r"^#+\s*", "", notes, flags=re.M)  # heading markers
          notes = re.sub(r"^\* ", "• ", notes, flags=re.M)  # bullets

          # Apple caps whatToTest at 4000 characters.
          print(notes.strip()[:4000])
          PY
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # eas.json pins appVersionSource: remote, so EAS owns the build number and
      # nothing here writes back to the repo. The marketing version still comes
      # from app.json, which release-please bumps.
      - name: Build
        env:
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
          SUBMIT: ${{ inputs.submit }}
          ATTACH: ${{ inputs.attach-to-release }}
          # Unset on workflow_call, where waiting is always what we want.
          WAIT: ${{ inputs.wait }}
          MESSAGE: ${{ inputs.message || github.sha }}
        run: |
          args=(--platform "$PLATFORM" --profile "$PROFILE" --non-interactive --message "$MESSAGE")
          if [ "$SUBMIT" = "true" ]; then
            # No --what-to-test here: it maps to EAS Submit's Enterprise-only
            # changelog parameter and fails submission scheduling outright on
            # other plans. The notes land in the job summary instead.
            args+=(--auto-submit)
          fi
          if [ -n "$ATTACH" ]; then
            # The attach step needs the artifact URL, so wait and capture the
            # build JSON (progress still streams to stderr).
            eas build "${args[@]}" --json > /tmp/eas-build.json
          else
            if [ "$WAIT" = "false" ]; then
              args+=(--no-wait)
            fi
            eas build "${args[@]}"
          fi

      # Same shape as tm-sync binaries: the APK + its sha256 land on the GitHub
      # Release page, which is the whole Android distribution channel.
      - name: Attach APK to GitHub Release
        if: ${{ inputs.attach-to-release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.attach-to-release }}
        run: |
          url=$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl // empty' /tmp/eas-build.json)
          if [ -z "$url" ]; then
            echo "::error::EAS build output has no artifact URL — build likely failed or JSON shape changed."
            exit 1
          fi
          ASSET="TraderMemos-${VERSION}.apk"
          curl -fsSL --retry 3 -o "$ASSET" "$url"
          sha256sum "$ASSET" > "$ASSET.sha256"
          # Second copy under a version-less name. GitHub's permanent
          # /releases/latest/download/<asset> link resolves by exact filename,
          # so a versioned asset can never back a stable URL — the docs page
          # links TraderMemos.apk and it has to mean "whatever shipped last".
          # The versioned copy stays as the per-release archive.
          cp "$ASSET" TraderMemos.apk
          sha256sum TraderMemos.apk > TraderMemos.apk.sha256
          gh release upload "v$VERSION" \
            "$ASSET" "$ASSET.sha256" TraderMemos.apk TraderMemos.apk.sha256 \
            --clobber --repo "$GITHUB_REPOSITORY"
