# Opens Release PRs from conventional commits on main. Merging the PR tags
# vX.Y.Z, updates CHANGELOG.md / VERSION / web/package.json, and publishes
# a GitHub Release. Docker images are built in the chained publish job below
# (GITHUB_TOKEN releases do not trigger separate workflow runs).
#
# Commit style: feat:, fix:, feat!: (see docs/release.md)

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # With a RELEASE_PLEASE_TOKEN PAT (contents + pull-requests write), the
      # Release PR triggers CI like a human PR — no per-release run approval.
      # Falls back to GITHUB_TOKEN, whose PRs need manual workflow approval.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish-docker:
    name: Publish Docker images
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets: inherit

  publish-tm-sync:
    name: Release tm-sync binaries
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    uses: ./.github/workflows/tm-sync-release.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets: inherit

  # iOS is not built here any more. EAS cloud builds are metered and a release
  # spent two of them — one per platform — so the month's quota ran out and the
  # iOS build of v0.12.0 failed while the Android one squeaked through. iOS now
  # builds on the self-hosted M1 Pro, which is unmetered and runs the same
  # Xcode EAS would (26.6 GM); see the ios-release workflow on the private
  # Forgejo remote, where the App Store Connect key lives.
  #
  # `mobile-eas.yml` is deliberately still here and still works by manual
  # dispatch: the quota resets monthly, and a single self-hosted Mac is a
  # single point of failure worth having a spare for.

  # Android has no store presence: the release-signed APK attached to the
  # GitHub Release page IS the distribution channel (sideload / self-hosters),
  # so this runs ungated like the tm-sync binaries.
  build-android:
    name: Build Android APK
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    uses: ./.github/workflows/mobile-eas.yml
    with:
      profile: production-apk
      platform: android
      attach-to-release: ${{ needs.release-please.outputs.version }}
      message: v${{ needs.release-please.outputs.version }}
    secrets: inherit
