name: Bug report
description: Something is broken in the app or API
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From `GET /healthz` or Settings → About
      placeholder: '0.1.6'
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Docker all-in-one (make up)
        - Docker + Postgres
        - Split CDN + API (Vercel/Cloudflare/Netlify + Railway/VPS)
        - Local development (make dev)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: '`make logs` / `docker compose logs api` output around the failure. Redact secrets.'
      render: text
