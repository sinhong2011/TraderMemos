root = "."
tmp_dir = "tmp"
env_files = [".env"]

[build]
  # Resolves Homebrew tesseract/leptonica paths; falls back to no-OCR if missing.
  cmd = "./scripts/build-dev.sh ./tmp/server"
  entrypoint = "./tmp/server"
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  exclude_dir = ["tmp", "vendor", "testdata", "internal/store"]
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = false

[color]
  main   = "magenta"
  build  = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
