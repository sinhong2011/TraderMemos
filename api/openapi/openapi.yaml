openapi: 3.1.0
info:
  title: TraderMemos API
  version: 1.0.0
  description: |
    Self-hosted trading journal API.

    Authenticate with either:
    - A short-lived session JWT from `POST /api/v1/auth/login` (web app)
    - A personal access token (`tm_pat_…`) from Settings → API or `POST /api/v1/access-tokens`

    Send the secret as `Authorization: Bearer <token>`.
servers:
  - url: /
    description: This API host
tags:
  - name: Health
  - name: Auth
  - name: Access tokens
  - name: Accounts
  - name: Trades
  - name: Executions
  - name: Cash
  - name: Import
  - name: Export
  - name: Analytics
  - name: Tags
  - name: Setups
  - name: Notes
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                  go:
                    type: string
                  commit:
                    type: string

  /api/v1/system/info:
    get:
      tags: [Health]
      summary: Server build and runtime info
      operationId: getSystemInfo
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: 0.1.10
                  commit:
                    type: string
                  build_time:
                    type: string
                    format: date-time
                  go:
                    type: string
                  started_at:
                    type: string
                    format: date-time
                  uptime_sec:
                    type: integer
                  db_driver:
                    type: string
                    enum: [sqlite, postgres]
                  features:
                    type: object
                    additionalProperties:
                      type: boolean

  /api/v1/setup/status:
    get:
      tags: [Auth]
      summary: Setup / registration status
      operationId: getSetupStatus
      security: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"

  /api/v1/setup:
    post:
      tags: [Auth]
      summary: Complete first-user setup
      operationId: completeSetup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Owner created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register (when registration is open)
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/me:
    get:
      tags: [Auth]
      summary: The signed-in user
      operationId: getMe
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/me/password:
    put:
      tags: [Auth]
      summary: Change your own password
      description: >-
        Re-hashes after verifying the current password. Every refresh token
        minted against the old password stops working, so other devices are
        signed out at their next refresh; a fresh pair is returned so the
        caller is not. Access tokens already issued remain valid until they
        expire (15 minutes).
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        "200":
          description: New token pair for this caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/me/totp/start:
    post:
      tags: [Auth]
      summary: Begin authenticator setup
      description: >-
        Mints a candidate secret and its otpauth:// URL. Nothing is stored
        until /me/totp/confirm proves a code can be read from it, so the
        client holds the candidate between the two calls.
      operationId: startTotp
      responses:
        "200":
          description: Candidate secret
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_url]
                properties:
                  secret:
                    type: string
                    description: Base32, for manual entry when a QR cannot be scanned.
                  otpauth_url: { type: string }
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/me/totp/confirm:
    post:
      tags: [Auth]
      summary: Finish authenticator setup
      operationId: confirmTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret, code]
              properties:
                secret: { type: string }
                code: { type: string }
      responses:
        "204": { description: Enabled }
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/me/totp/disable:
    post:
      tags: [Auth]
      summary: Turn off two-factor
      description: >-
        Requires the password as well as a current code, so a borrowed
        unlocked session cannot strip the factor. POST rather than DELETE
        because it carries a body.


        If the authenticator is lost, the recovery path is shell access to
        the server: `tradermemos disable-totp --email you@example.com`.
        There are deliberately no recovery codes to store or lose.
      operationId: disableTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string }
      responses:
        "204": { description: Disabled }
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/access-tokens:
    get:
      tags: [Access tokens]
      summary: List personal access tokens
      operationId: listAccessTokens
      responses:
        "200":
          description: Tokens (secrets never included)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [Access tokens]
      summary: Create a personal access token
      description: |
        Returns the full `token` secret **once**. Store it securely; it cannot be retrieved again.
        Omit `expires_in_days` for a never-expiring token, or pass `30`, `90`, or `365`.
      operationId: createAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 80
                expires_in_days:
                  type: integer
                  enum: [30, 90, 365]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AccessToken"
                  - type: object
                    required: [token]
                    properties:
                      token:
                        type: string
                        description: Full secret (`tm_pat_…`); shown only on create
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/access-tokens/{id}:
    delete:
      tags: [Access tokens]
      summary: Revoke a personal access token
      operationId: revokeAccessToken
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/accounts:
    get:
      tags: [Accounts]
      summary: List accounts
      operationId: listAccounts
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [Accounts]
      summary: Create account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccount"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/accounts/{id}:
    get:
      tags: [Accounts]
      summary: Get account
      operationId: getAccount
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [Accounts]
      summary: Update account
      operationId: updateAccount
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                broker:
                  type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
    delete:
      tags: [Accounts]
      summary: Delete account
      operationId: deleteAccount
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted

  /api/v1/trades:
    get:
      tags: [Trades]
      summary: List trades
      operationId: listTrades
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Trades
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true

  /api/v1/trades/{id}:
    get:
      tags: [Trades]
      summary: Get trade
      operationId: getTrade
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Trade
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Trades]
      summary: Update trade journal fields
      operationId: patchTrade
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated
    delete:
      tags: [Trades]
      summary: Delete trade
      operationId: deleteTrade
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted

  /api/v1/executions:
    get:
      tags: [Executions]
      summary: List executions
      operationId: listExecutions
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
      responses:
        "200":
          description: Executions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
    post:
      tags: [Executions]
      summary: Create execution
      operationId: createExecution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Created

  /api/v1/executions/{id}:
    patch:
      tags: [Executions]
      summary: Update execution
      operationId: updateExecution
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated
    delete:
      tags: [Executions]
      summary: Delete execution
      operationId: deleteExecution
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted

  /api/v1/cash-transactions:
    get:
      tags: [Cash]
      summary: List cash transactions
      operationId: listCash
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
      responses:
        "200":
          description: Cash transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
    post:
      tags: [Cash]
      summary: Create cash transaction
      operationId: createCash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Created

  /api/v1/cash-transactions/{id}:
    put:
      tags: [Cash]
      summary: Update cash transaction
      operationId: updateCash
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated
    delete:
      tags: [Cash]
      summary: Delete cash transaction
      operationId: deleteCash
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted

  /api/v1/imports:
    get:
      tags: [Import]
      summary: List import batches
      operationId: listImports
      responses:
        "200":
          description: Import batches
    post:
      tags: [Import]
      summary: Preview import (multipart CSV/JSON)
      operationId: previewImport
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Preview

  /api/v1/imports/commit:
    post:
      tags: [Import]
      summary: Commit import without a preview batch (creates account from JSON when needed)
      operationId: commitImportFresh
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                account_id:
                  type: string
      responses:
        "200":
          description: Committed

  /api/v1/imports/{id}/commit:
    post:
      tags: [Import]
      summary: Commit import batch
      operationId: commitImport
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Committed

  /api/v1/exports:
    get:
      tags: [Export]
      summary: Export journal data
      operationId: exportJournal
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, json]
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
      responses:
        "200":
          description: Export payload

  /api/v1/analytics/summary:
    get:
      tags: [Analytics]
      summary: P&L summary
      operationId: analyticsSummary
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/analytics/daily:
    get:
      tags: [Analytics]
      summary: Daily P&L
      operationId: analyticsDaily
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
        - $ref: "#/components/parameters/TzQuery"
      responses:
        "200":
          description: Daily rows

  /api/v1/analytics/behavior:
    get:
      tags: [Analytics]
      summary: Behavioral pattern report (revenge trading, overconfidence, loss aversion)
      operationId: analyticsBehavior
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
        - $ref: "#/components/parameters/TzQuery"
      responses:
        "200":
          description: Behavior report
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/analytics/equity-curve:
    get:
      tags: [Analytics]
      summary: Equity curve
      operationId: analyticsEquityCurve
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
      responses:
        "200":
          description: Equity points

  /api/v1/tags:
    get:
      tags: [Tags]
      summary: List tags
      operationId: listTags
      responses:
        "200":
          description: Tags
    post:
      tags: [Tags]
      summary: Create tag
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                color:
                  type: string
                kind:
                  type: string
      responses:
        "201":
          description: Created

  /api/v1/setups:
    get:
      tags: [Setups]
      summary: List playbook setups
      operationId: listSetups
      responses:
        "200":
          description: Setups
    post:
      tags: [Setups]
      summary: Create setup
      operationId: createSetup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Created

  /api/v1/notes:
    get:
      tags: [Notes]
      summary: List journal notes
      operationId: listNotes
      parameters:
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
      responses:
        "200":
          description: Notes
    post:
      tags: [Notes]
      summary: Create note
      operationId: createNote
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Created

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Session JWT access token **or** personal access token (`tm_pat_…`).
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    AccountIdQuery:
      name: account_id
      in: query
      schema:
        type: string
    FromQuery:
      name: from
      in: query
      description: RFC3339 start time
      schema:
        type: string
        format: date-time
    ToQuery:
      name: to
      in: query
      description: RFC3339 end time
      schema:
        type: string
        format: date-time
    TzQuery:
      name: tz
      in: query
      description: >
        IANA timezone for day / hour-of-day / weekday bucketing
        (e.g. `America/New_York`). Defaults to UTC. Session bucketing
        always uses the US-equity clock (Eastern).
      schema:
        type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        totp_code:
          type: string
          description: >-
            Sent on the second leg of sign-in, after a login answered 401 with
            code `totp_required`. A wrong password answers a plain
            `unauthorized` whether or not the account has an authenticator, so
            the response never reveals that it does.
    Me:
      type: object
      required: [id, email, is_admin, created_at, totp_enabled]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        is_admin: { type: boolean }
        created_at: { type: string, format: date-time }
        totp_enabled:
          type: boolean
          description: Always false today — the column exists but nothing writes it.

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        is_admin:
          type: boolean
    SetupStatus:
      type: object
      properties:
        needs_setup:
          type: boolean
        registration_open:
          type: boolean
        user_count:
          type: integer
        min_password_length:
          type: integer
    SetupRequest:
      allOf:
        - $ref: "#/components/schemas/Credentials"
        - type: object
          properties:
            account:
              $ref: "#/components/schemas/CreateAccount"
    AccessToken:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        token_prefix:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
    Account:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        broker:
          type: string
        account_type:
          type: string
        base_currency:
          type: string
        starting_balance:
          type: number
    CreateAccount:
      type: object
      required: [name]
      properties:
        name:
          type: string
        broker:
          type: string
        account_type:
          type: string
        base_currency:
          type: string
        starting_balance:
          type: number

security:
  - bearerAuth: []
