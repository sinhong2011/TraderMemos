openapi: 3.1.0
info:
  title: TraderMemos API
  version: 1.0.0
  description: |
    Self-hosted trading journal API.

    Authenticate with either:
    - A short-lived session JWT from `POST /api/v1/auth/login` (web app)
    - A personal access token (`tm_pat_…`) from Settings → API or `POST /api/v1/access-tokens`

    Send the secret as `Authorization: Bearer <token>`.
servers:
  - url: /
    description: This API host
tags:
  - name: Health
  - name: Auth
  - name: Access tokens
  - name: Share links
  - name: Accounts
  - name: Trades
  - name: Executions
  - name: Cash
  - name: Import
  - name: Export
  - name: Analytics
  - name: Tags
  - name: Setups
  - name: Notes
  - name: Admin
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                  go:
                    type: string
                  commit:
                    type: string

  /api/v1/system/info:
    get:
      tags: [Health]
      summary: Server build and runtime info
      operationId: getSystemInfo
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: 0.1.10
                  commit:
                    type: string
                  build_time:
                    type: string
                    format: date-time
                  go:
                    type: string
                  started_at:
                    type: string
                    format: date-time
                  uptime_sec:
                    type: integer
                  db_driver:
                    type: string
                    enum: [sqlite, postgres]
                  features:
                    type: object
                    additionalProperties:
                      type: boolean

  /api/v1/setup/status:
    get:
      tags: [Auth]
      summary: Setup / registration status
      operationId: getSetupStatus
      security: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"

  /api/v1/setup:
    post:
      tags: [Auth]
      summary: Complete first-user setup
      operationId: completeSetup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Owner created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register (when registration is open)
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/access-tokens/{id}/uses:
    get:
      tags: [Access tokens]
      summary: Where a token has been used from
      description: >-
        `last_used_at` on the token answers "recently?"; this answers "by
        what?", which is the question you ask when a token might have leaked.


        Rows are appended when the client looks new — a different IP or
        user-agent, or the same one after ten minutes — so a token driving a
        cron writes one row, not one per request. The newest 50 per token are
        kept. Scoped to the calling user: another user's token id returns an
        empty list, not an error.
      operationId: listAccessTokenUses
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [used_at, ip, user_agent]
                  properties:
                    used_at: { type: string, format: date-time }
                    ip: { type: string }
                    user_agent:
                      type: string
                      description: Raw and unparsed — the full string is what you match your own tooling against.

  /api/v1/me:
    get:
      tags: [Auth]
      summary: The signed-in user
      operationId: getMe
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/me/password:
    put:
      tags: [Auth]
      summary: Change your own password
      description: >-
        Re-hashes after verifying the current password. Every refresh token
        minted against the old password stops working, so other devices are
        signed out at their next refresh; a fresh pair is returned so the
        caller is not. Access tokens already issued remain valid until they
        expire (15 minutes).
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        "200":
          description: New token pair for this caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/me/totp/start:
    post:
      tags: [Auth]
      summary: Begin authenticator setup
      description: >-
        Mints a candidate secret and its otpauth:// URL. Nothing is stored
        until /me/totp/confirm proves a code can be read from it, so the
        client holds the candidate between the two calls.
      operationId: startTotp
      responses:
        "200":
          description: Candidate secret
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_url]
                properties:
                  secret:
                    type: string
                    description: Base32, for manual entry when a QR cannot be scanned.
                  otpauth_url: { type: string }
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/me/totp/confirm:
    post:
      tags: [Auth]
      summary: Finish authenticator setup
      operationId: confirmTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret, code]
              properties:
                secret: { type: string }
                code: { type: string }
      responses:
        "204": { description: Enabled }
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/me/totp/disable:
    post:
      tags: [Auth]
      summary: Turn off two-factor
      description: >-
        Requires the password as well as a current code, so a borrowed
        unlocked session cannot strip the factor. POST rather than DELETE
        because it carries a body.


        If the authenticator is lost, the recovery path is shell access to
        the server: `tradermemos disable-totp --email you@example.com`.
        There are deliberately no recovery codes to store or lose.
      operationId: disableTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string }
      responses:
        "204": { description: Disabled }
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/access-tokens:
    get:
      tags: [Access tokens]
      summary: List personal access tokens
      operationId: listAccessTokens
      responses:
        "200":
          description: Tokens (secrets never included)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [Access tokens]
      summary: Create a personal access token
      description: |
        Returns the full `token` secret **once**. Store it securely; it cannot be retrieved again.
        Omit `expires_in_days` for a never-expiring token, or pass `30`, `90`, or `365`.
      operationId: createAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 80
                expires_in_days:
                  type: integer
                  enum: [30, 90, 365]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AccessToken"
                  - type: object
                    required: [token]
                    properties:
                      token:
                        type: string
                        description: Full secret (`tm_pat_…`); shown only on create
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/access-tokens/{id}:
    delete:
      tags: [Access tokens]
      summary: Revoke a personal access token
      operationId: revokeAccessToken
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/share-links:
    get:
      tags: [Share links]
      summary: List share links
      description: All endpoints under this tag 404 unless `TM_SHARE_LINKS_ENABLED=true`.
      operationId: listShareLinks
      responses:
        "200":
          description: Active share links (token included so the URL can be re-copied)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShareLink"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [Share links]
      summary: Create a share link
      description: |
        Mints a revocable public link for a read-only performance summary.
        Omit `expires_in_days` for the 90-day default; `0` means never expires.
        With `show_amounts` false (the default) the public payload carries
        ratios and shape only — no absolute money amounts.
      operationId: createShareLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                  description: Limit the link to one account (empty = all)
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
                tz:
                  type: string
                  description: IANA timezone for day/month bucketing
                show_amounts:
                  type: boolean
                currency:
                  type: string
                  description: Currency label for amounts when `show_amounts`
                expires_in_days:
                  type: integer
                  minimum: 0
                  maximum: 730
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLink"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/share-links/{id}:
    delete:
      tags: [Share links]
      summary: Revoke a share link
      operationId: revokeShareLink
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/public/share/{token}:
    get:
      tags: [Share links]
      summary: Public share summary
      description: |
        The page behind a share link. Unauthenticated by design and rate-limited.
        Disabled, unknown, revoked, and expired links all answer the same 404.
        The payload is a dedicated aggregate (never trade rows or account
        names); money fields appear only when the link allows amounts.
      operationId: getPublicShare
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Aggregate performance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicShareSummary"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/accounts:
    get:
      tags: [Accounts]
      summary: List accounts
      operationId: listAccounts
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [Accounts]
      summary: Create account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccount"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/accounts/{id}:
    get:
      tags: [Accounts]
      summary: Get account
      operationId: getAccount
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [Accounts]
      summary: Update account
      operationId: updateAccount
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                broker:
                  type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
    delete:
      tags: [Accounts]
      summary: Delete account
      operationId: deleteAccount
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted

  /api/v1/trades:
    get:
      tags: [Trades]
      summary: List trades
      operationId: listTrades
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Trades
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true

  /api/v1/trades/{id}:
    get:
      tags: [Trades]
      summary: Get trade
      operationId: getTrade
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Trade
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Trades]
      summary: Update trade journal fields
      operationId: patchTrade
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated
    delete:
      tags: [Trades]
      summary: Delete trade
      operationId: deleteTrade
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted

  /api/v1/executions:
    get:
      tags: [Executions]
      summary: List executions
      operationId: listExecutions
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
      responses:
        "200":
          description: Executions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
    post:
      tags: [Executions]
      summary: Create execution
      operationId: createExecution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Created

  /api/v1/executions/{id}:
    patch:
      tags: [Executions]
      summary: Update execution
      operationId: updateExecution
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated
    delete:
      tags: [Executions]
      summary: Delete execution
      operationId: deleteExecution
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted

  /api/v1/cash-transactions:
    get:
      tags: [Cash]
      summary: List cash transactions
      operationId: listCash
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
      responses:
        "200":
          description: Cash transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
    post:
      tags: [Cash]
      summary: Create cash transaction
      operationId: createCash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Created

  /api/v1/cash-transactions/{id}:
    put:
      tags: [Cash]
      summary: Update cash transaction
      operationId: updateCash
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated
    delete:
      tags: [Cash]
      summary: Delete cash transaction
      operationId: deleteCash
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted

  /api/v1/imports:
    get:
      tags: [Import]
      summary: List import batches
      operationId: listImports
      responses:
        "200":
          description: Import batches, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportBatch"
    post:
      tags: [Import]
      summary: Preview an import (parse-only, no batch created)
      description: |
        Parses the upload and returns headers, sample rows, and a suggested
        column mapping — nothing is written. Accepted uploads:

        - **Fill CSV** — one row per execution. Known broker exports are
          detected from the header signature (`detected_broker`) and pre-fill
          the mapping and `suggested_source_tz`.
        - **Journal CSV** — one row per finished trade (Stonk Journal-style);
          detected as `format: journal_trades`, no mapping step.
        - **MetaTrader statement** — the MT5 Trade History Report
          (XLSX/HTML) or MT4 Statement / Account History (HTML), detected from
          content (`source: statement`); parsed positionally, no mapping.
          `suggested_source_tz` is the MetaTrader server-time convention
          (`Europe/Athens`), never UTC.
        - **JSON backup** — a TraderMemos export; `account_id` may be omitted
          and is matched (or deferred to commit as `pending_account`) from the
          backup's account metadata. CSV/statement uploads require `account_id`.

        Uploads are limited to `TM_IMPORT_MAX_BYTES` (default 10 MiB) → 413.
      operationId: previewImport
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                account_id:
                  type: string
                  description: Target account. Optional for JSON backups only.
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"

  /api/v1/imports/commit:
    post:
      tags: [Import]
      summary: Commit an import in one step (no prior batch)
      description: |
        Creates the import batch and commits it in one call — the flow the web
        client uses after a parse-only preview. For JSON backups without
        `account_id`, the account is matched from backup metadata or created.
        The whole commit is one transaction; on failure the batch is marked
        `failed` and no rows are written.
      operationId: commitImportFresh
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportCommitForm"
      responses:
        "200":
          description: Committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /api/v1/imports/{id}/commit:
    post:
      tags: [Import]
      summary: Commit a previously created import batch
      description: Re-upload the same file and commit it against an existing pending batch.
      operationId: commitImport
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportCommitForm"
      responses:
        "200":
          description: Committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /api/v1/imports/{id}:
    delete:
      tags: [Import]
      summary: Reverse an import batch
      description: |
        Deletes the batch's executions, marks the batch `reversed`, and
        regroups the account's trades. Journal annotations on surviving trades
        are unaffected.
      operationId: deleteImport
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Reversed

  /api/v1/exports:
    get:
      tags: [Export]
      summary: Export journal data
      operationId: exportJournal
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, json]
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
      responses:
        "200":
          description: Export payload

  /api/v1/analytics/summary:
    get:
      tags: [Analytics]
      summary: P&L summary
      operationId: analyticsSummary
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/analytics/daily:
    get:
      tags: [Analytics]
      summary: Daily P&L
      operationId: analyticsDaily
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
        - $ref: "#/components/parameters/TzQuery"
      responses:
        "200":
          description: Daily rows

  /api/v1/analytics/behavior:
    get:
      tags: [Analytics]
      summary: Behavioral pattern report (revenge trading, overconfidence, loss aversion)
      operationId: analyticsBehavior
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
        - $ref: "#/components/parameters/TzQuery"
      responses:
        "200":
          description: Behavior report
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/analytics/equity-curve:
    get:
      tags: [Analytics]
      summary: Equity curve
      operationId: analyticsEquityCurve
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
      responses:
        "200":
          description: Equity points

  /api/v1/tags:
    get:
      tags: [Tags]
      summary: List tags
      operationId: listTags
      responses:
        "200":
          description: Tags
    post:
      tags: [Tags]
      summary: Create tag
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                color:
                  type: string
                kind:
                  type: string
      responses:
        "201":
          description: Created

  /api/v1/setups:
    get:
      tags: [Setups]
      summary: List playbook setups
      operationId: listSetups
      responses:
        "200":
          description: Setups
    post:
      tags: [Setups]
      summary: Create setup
      operationId: createSetup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Created

  /api/v1/notes:
    get:
      tags: [Notes]
      summary: List journal notes
      operationId: listNotes
      parameters:
        - $ref: "#/components/parameters/FromQuery"
        - $ref: "#/components/parameters/ToQuery"
      responses:
        "200":
          description: Notes
    post:
      tags: [Notes]
      summary: Create note
      operationId: createNote
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Created

  /api/v1/me/preferences:
    get:
      tags: [Auth]
      summary: Account-level client preferences
      description: |
        An opaque JSON object owned by the clients — timezones, clock format,
        display currency, trade date basis, screenshots cap. The server never
        reads inside it. Empty until something is stored.
      operationId: getPreferences
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  prefs:
                    type: object
                    additionalProperties: true
                  updated_at: { type: string, format: date-time }
    patch:
      tags: [Auth]
      summary: Merge preferences
      description: |
        Merges per key: keys not sent are left alone, so two devices editing
        different preferences do not clobber each other. An explicit null is
        stored as null (`displayCurrency: null` means "follow the account").
      operationId: patchPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: The merged result
        "413":
          description: Too many keys, or the blob exceeds 16 KiB

  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: List every account on this server
      description: Owner-only; anyone else gets 403.
      operationId: listUsers
      responses:
        "200":
          description: Users
        "403":
          description: Owner access required
    post:
      tags: [Admin]
      summary: Create a user
      description: Bypasses the registration gate — an owner inviting someone is not open sign-up.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string, minLength: 10 }
                is_admin: { type: boolean }
      responses:
        "201":
          description: Created
        "409":
          description: That username is taken

  /api/v1/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Admin]
      summary: Promote or demote a user
      operationId: setUserAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_admin]
              properties:
                is_admin: { type: boolean }
      responses:
        "200":
          description: Updated
        "409":
          description: Refused — this is the last owner
    delete:
      tags: [Admin]
      summary: Delete a user
      description: Cascades every account, trade, note and attachment they own. No undo.
      operationId: deleteUser
      responses:
        "204":
          description: Deleted
        "400":
          description: You cannot delete your own account here
        "409":
          description: Refused — this is the last owner

  /api/v1/admin/users/{id}/password:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Admin]
      summary: Reset a user's password
      description: No current password — the point is that the user does not have it. Invalidates their refresh tokens.
      operationId: adminResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string, minLength: 10 }
      responses:
        "204":
          description: Reset

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Session JWT access token **or** personal access token (`tm_pat_…`).
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    AccountIdQuery:
      name: account_id
      in: query
      description: >-
        Account scope. Accepts a single account id, a comma-separated list, or
        the parameter repeated (portfolio mode). Multi-account scopes must share
        one base currency; mixed-currency selections return 400
        `mixed_currencies`. Omit for all accounts.
      schema:
        type: string
    FromQuery:
      name: from
      in: query
      description: RFC3339 start time
      schema:
        type: string
        format: date-time
    ToQuery:
      name: to
      in: query
      description: RFC3339 end time
      schema:
        type: string
        format: date-time
    TzQuery:
      name: tz
      in: query
      description: >
        IANA timezone for day / hour-of-day / weekday bucketing
        (e.g. `America/New_York`). Defaults to UTC. Session bucketing
        always uses the US-equity clock (Eastern).
      schema:
        type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        totp_code:
          type: string
          description: >-
            Sent on the second leg of sign-in, after a login answered 401 with
            code `totp_required`. A wrong password answers a plain
            `unauthorized` whether or not the account has an authenticator, so
            the response never reveals that it does.
    Me:
      type: object
      required: [id, email, is_admin, created_at, totp_enabled]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        is_admin: { type: boolean }
        created_at: { type: string, format: date-time }
        totp_enabled:
          type: boolean
          description: Always false today — the column exists but nothing writes it.

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        is_admin:
          type: boolean
    SetupStatus:
      type: object
      properties:
        needs_setup:
          type: boolean
        registration_open:
          type: boolean
        user_count:
          type: integer
        min_password_length:
          type: integer
    SetupRequest:
      allOf:
        - $ref: "#/components/schemas/Credentials"
        - type: object
          properties:
            account:
              $ref: "#/components/schemas/CreateAccount"
    AccessToken:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        token_prefix:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
    ShareLink:
      type: object
      properties:
        id:
          type: string
        token:
          type: string
          description: URL token; the public page lives at `/s/{token}`
        scope:
          type: object
          properties:
            account_id:
              type: string
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
            tz:
              type: string
            show_amounts:
              type: boolean
            currency:
              type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        view_count:
          type: integer
    PublicShareSummary:
      type: object
      description: >
        Aggregate built by the dedicated share serializer. `summary` money
        fields, per-month `pnl`, per-symbol `pnl`, and `best_day_pnl` /
        `worst_day_pnl` are present only when the link allows amounts; with
        amounts hidden the equity values are scaled to max |value| = 1.
      properties:
        summary:
          type: object
          additionalProperties: true
        equity:
          type: array
          items:
            type: object
            properties:
              at:
                type: string
                format: date-time
              value:
                type: number
        months:
          type: array
          items:
            type: object
            additionalProperties: true
        top_symbols:
          type: array
          items:
            type: object
            additionalProperties: true
        trading_days:
          type: integer
        green_days:
          type: integer
        red_days:
          type: integer
        best_streak:
          type: integer
        worst_streak:
          type: integer
        first_day:
          type: string
        last_day:
          type: string
        show_amounts:
          type: boolean
        currency:
          type: string
    Account:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        broker:
          type: string
        account_type:
          type: string
        base_currency:
          type: string
        starting_balance:
          type: number
    CreateAccount:
      type: object
      required: [name]
      properties:
        name:
          type: string
        broker:
          type: string
        account_type:
          type: string
        base_currency:
          type: string
        starting_balance:
          type: number

    NullString:
      type: object
      description: Go `sql.NullString` encoding of a nullable string.
      properties:
        String:
          type: string
        Valid:
          type: boolean

    ImportBatch:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        account_id:
          type: string
        source:
          type: string
          enum: [csv, json, statement]
        filename:
          $ref: "#/components/schemas/NullString"
        column_mapping:
          $ref: "#/components/schemas/NullString"
        row_count:
          type: integer
        status:
          type: string
          enum: [pending, committed, failed, reversed]
        created_at:
          type: string
          format: date-time

    ImportPreview:
      type: object
      properties:
        headers:
          type: array
          items:
            type: string
        sample_rows:
          type: array
          description: Up to 5 parsed rows keyed by header.
          items:
            type: object
            additionalProperties:
              type: string
        suggested_mapping:
          type: object
          description: >
            Canonical field → header guesses (broker preset beats
            header-substring detection). Empty for statements and journal CSVs,
            which are parsed without a mapping.
          additionalProperties:
            type: string
        detected_broker:
          type: string
          description: >
            Preset or statement display name (e.g. `cTrader (History)`,
            `MetaTrader 5 (Trade History Report)`); empty when unrecognized.
        suggested_source_tz:
          type: string
          description: >
            IANA zone the file's offset-less timestamps are assumed to be in;
            override with `source_tz` on commit.
        format:
          type: string
          enum: [executions, journal_trades, account_backup]
        source:
          type: string
          enum: [csv, json, statement]
        row_count:
          type: integer
        import_batch_id:
          type: string
          description: Always empty — preview is parse-only.
        account_id:
          type: string
        pending_account:
          description: >
            Present for JSON backups whose account has no match yet — the
            metadata the commit step would create an account from.
          type: object
          properties:
            name:
              type: string
            broker:
              type: string
            account_type:
              type: string
            base_currency:
              type: string
            starting_balance:
              type: number
        journal_summary:
          type: object
          description: Journal CSVs only.
          additionalProperties: true
        sample_trades:
          type: array
          description: Journal CSVs only.
          items:
            type: object
            additionalProperties: true

    ImportCommitForm:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
        account_id:
          type: string
          description: >
            Fresh commit only (`POST /imports/commit`); ignored on batch
            commit. Optional for JSON backups — matched or created from backup
            metadata when omitted.
        column_mapping:
          type: string
          description: >
            JSON object of canonical field → CSV header. Required for fill
            CSVs; ignored for journal CSVs, statements, and JSON backups.
        source_tz:
          type: string
          description: >
            IANA zone to read offset-less timestamps in. Defaults to the
            detected broker preset's zone (fill CSV) or the MetaTrader
            server-time convention `Europe/Athens` (statement) — never UTC
            unless the preset says so.
        journal_option_overrides:
          type: string
          description: >
            Journal CSVs only — JSON object of row number → option right
            (`call`/`put`) for ambiguous option rows.

    RowError:
      type: object
      properties:
        row:
          type: integer
        message:
          type: string

    ImportResult:
      type: object
      properties:
        inserted:
          type: integer
        skipped:
          type: integer
          description: Duplicate fills (same symbol+side+quantity+price+time in the account).
        annotated:
          type: integer
        trades:
          type: integer
        cash_inserted:
          type: integer
          description: JSON backups only.
        setups_upserted:
          type: integer
          description: JSON backups only.
        format:
          type: string
        account_id:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/RowError"

security:
  - bearerAuth: []
