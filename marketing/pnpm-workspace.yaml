packages:
  - "."

# pnpm 11 blocks postinstall scripts unless they're listed here, and exits non-zero on an
# unapproved one — which makes `pnpm build` / `pnpm types:check` fail before they start.
# `vue-demi` comes from @scalar/api-client-react (the Scalar playground is a Vue app under
# the React wrapper); the rest are the toolchain's prebuilt binaries.
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
