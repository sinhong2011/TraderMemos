packages:
  - "."

# React Native / Metro resolve native modules by walking a flat node_modules tree, and
# Expo autolinking scans it directly — pnpm's default symlinked store breaks both.
# `hoisted` keeps pnpm's CLI and lockfile with an npm-shaped layout on disk.
nodeLinker: hoisted

# pnpm 11 fails the install outright (ERR_PNPM_IGNORED_BUILDS) when a dependency has an
# undeclared build script, so every one has to be answered here — including the ones we
# say no to. `dtrace-provider` arrives with the eas-cli that expo/expo-github-action
# installs into this directory in CI; it is bunyan's optional DTrace binding, unused on
# Linux runners and unbuildable there.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  dtrace-provider: false

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.12'
  - '@expo/router-server@57.0.5'
  - expo-constants@57.0.9
  - expo-modules-core@57.0.9
  - expo@57.0.10
  - '@expo/ui@57.0.9'
  - expo-image@57.0.2
  - expo-linking@57.0.5
  - expo-router@57.0.10
