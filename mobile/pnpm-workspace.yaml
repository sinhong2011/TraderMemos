packages:
  - "."

# React Native / Metro resolve native modules by walking a flat node_modules tree, and
# Expo autolinking scans it directly — pnpm's default symlinked store breaks both.
# `hoisted` keeps pnpm's CLI and lockfile with an npm-shaped layout on disk.
nodeLinker: hoisted

allowBuilds:
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.12 || 57.0.13'
  - '@expo/router-server@57.0.5'
  - expo-constants@57.0.9
  - expo-modules-core@57.0.9 || 57.0.10
  - expo@57.0.10 || 57.0.11
  - '@expo/ui@57.0.9'
  - expo-image@57.0.2
  - expo-linking@57.0.5
  - expo-router@57.0.10 || 57.0.11
  - '@expo/config-plugins@57.0.7'
  - babel-preset-expo@57.0.6
  - expo-asset@57.0.9
  - expo-file-system@57.0.2
  - expo-image-picker@57.0.8
  - expo-sharing@57.0.10
  - expo-symbols@57.0.2
  # PanelUI ships fixes daily while it stabilises on the 0.x line — track latest.
  - panelui-native
  - uniwind
