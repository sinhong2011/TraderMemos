# Self-host stack — pulls published images from Docker Hub by default.
#
# Username / tag (Compose loads `.env` automatically):
#   DOCKERHUB_USERNAME  — Hub namespace that owns the images (default: sinhong2011)
#   TM_IMAGE_TAG        — image tag (default: latest; prefer a semver in production)
#
#   cp .env.example .env   # then edit DOCKERHUB_USERNAME if you fork/publish your own
#
# Build from source instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build -d
#   # or: make up-build

services:
  api:
    image: ${DOCKERHUB_USERNAME:-sinhong2011}/tradermemos-api:${TM_IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      # Production: export TM_JWT_SECRET=$(openssl rand -hex 32) and omit ALLOW_INSECURE.
      TM_JWT_SECRET: ${TM_JWT_SECRET:-change-me}
      TM_ALLOW_INSECURE_JWT: ${TM_ALLOW_INSECURE_JWT:-true}
      TM_ALLOW_REGISTRATION: ${TM_ALLOW_REGISTRATION:-false}
      TM_DATABASE_URL: ${TM_DATABASE_URL:-sqlite:///data/tradermemos.db}
      TM_ATTACH_DIR: ${TM_ATTACH_DIR:-/data/attachments}
      TM_MARKET_DATA_ENABLED: ${TM_MARKET_DATA_ENABLED:-true}
      TM_MARKET_DATA_PROVIDER: ${TM_MARKET_DATA_PROVIDER:-yahoo}
      TM_MARKET_DATA_API_KEY: ${TM_MARKET_DATA_API_KEY:-}
      TM_OCR_ENABLED: ${TM_OCR_ENABLED:-false}
      TM_OCR_VISION_BASE_URL: ${TM_OCR_VISION_BASE_URL:-https://api.openai.com/v1}
      TM_OCR_VISION_API_KEY: ${TM_OCR_VISION_API_KEY:-}
      TM_OCR_VISION_MODEL: ${TM_OCR_VISION_MODEL:-gpt-4o-mini}
      # Only needed when the SPA is on another origin (Vercel/CF Pages).
      # Same-origin Docker (web → /api proxy) should leave this empty.
      TM_CORS_ORIGINS: ${TM_CORS_ORIGINS:-}
    volumes:
      - tm_data:/data
  web:
    image: ${DOCKERHUB_USERNAME:-sinhong2011}/tradermemos-web:${TM_IMAGE_TAG:-latest}
    ports:
      - "3000:80"
    depends_on:
      - api
volumes:
  tm_data:
