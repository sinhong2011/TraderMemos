services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      TM_JWT_SECRET: ${TM_JWT_SECRET:-change-me}
      TM_DB_PATH: /data/tradermemos.db
      TM_MARKET_DATA_ENABLED: ${TM_MARKET_DATA_ENABLED:-true}
      TM_MARKET_DATA_PROVIDER: ${TM_MARKET_DATA_PROVIDER:-yahoo}
      TM_MARKET_DATA_API_KEY: ${TM_MARKET_DATA_API_KEY:-}
      TM_OCR_ENABLED: ${TM_OCR_ENABLED:-false}
      TM_OCR_VISION_BASE_URL: ${TM_OCR_VISION_BASE_URL:-https://api.openai.com/v1}
      TM_OCR_VISION_API_KEY: ${TM_OCR_VISION_API_KEY:-}
      TM_OCR_VISION_MODEL: ${TM_OCR_VISION_MODEL:-gpt-4o-mini}
    volumes:
      - tm_data:/data
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
volumes:
  tm_data:
